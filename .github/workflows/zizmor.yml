name: zizmor

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/dependabot.yml'
      - '.github/zizmor.yml'
      - 'stubs/**/.github/workflows/**'
      - 'stubs/shared/.github/zizmor.yml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/dependabot.yml'
      - '.github/zizmor.yml'
      - 'stubs/**/.github/workflows/**'
      - 'stubs/shared/.github/zizmor.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: GitHub Actions security audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.7.1
        with:
          # Default input (.) — scans this repo's own .github/workflows/
          # AND the workflow templates shipped under stubs/**, so trigger
          # coverage above always matches what actually gets audited.
          # Gate via exit code + inline annotations. With advanced-security: true the
          # action uploads SARIF to code scanning instead and never fails the job.
          advanced-security: false
          persona: regular
