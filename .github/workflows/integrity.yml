name: integrity

on:
  push:
    paths:
      - '.ai/**'
      - 'checklists/**'
      - 'phases/**'
      - 'references/**'
      - 'stubs/**'
      - 'SPEC.md'
      - '.github/scripts/**'
      - '.github/workflows/integrity.yml'
  pull_request:
    paths:
      - '.ai/**'
      - 'checklists/**'
      - 'phases/**'
      - 'references/**'
      - 'stubs/**'
      - 'SPEC.md'
      - '.github/scripts/**'
      - '.github/workflows/integrity.yml'

permissions:
  contents: read

concurrency:
  group: integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    name: Layout matches Resolved Questions
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/check-layout.sh

  paths:
    name: Path integrity
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/check-paths.sh

  phase-coverage:
    name: Phase coverage
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/check-phase-coverage.sh

  dep-sync:
    name: Dep source-of-truth sync
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pyyaml
        run: pip install pyyaml

      - run: python3 .github/scripts/check-dep-sync.py

  placeholders:
    name: Placeholder coverage
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/check-placeholders.sh

  merge-keys:
    name: Merge-keys covers extras
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/check-merge-keys-coverage.sh

  audit-scoping:
    name: Audit scoping (opt-in gating)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/check-audit-scoping.sh

  yaml-validity:
    name: YAML syntactic validity
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pyyaml
        run: pip install pyyaml

      - run: bash .github/scripts/check-yaml-validity.sh

  stub-composer-validity:
    name: Stub composer.json validity
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: bash .github/scripts/check-stub-composer-validity.sh

  bootstrap-idempotency:
    name: Bootstrap phase idempotency (RQ41)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/check-bootstrap-idempotency.sh
