# Machine-readable parallel of per-category-deps.md.
# Phase 7 sync check parses this to verify:
#  (a) no package in both `require` and `require-dev` for the same category
#  (b) every dep here is referenced by name in the matching audit phase
#  (c) every dep here is in the matching upgrade phase's composer-require list

shared:
  always:
    require-dev:
      - laravel/pao
      - laravel/pint
      - phpstan/extension-installer
      - phpstan/phpstan-strict-rules
      - phpstan/phpstan-deprecation-rules
      - phpstan/phpstan-phpunit
      - rector/rector
      - rector/type-perfect
      - spaze/phpstan-disallowed-calls
      - symplify/phpstan-extensions
      - tomasvotruba/cognitive-complexity
      - tomasvotruba/type-coverage
      - nunomaduro/collision
      - orchestra/testbench
  # boost-family umbrella is NOT shared — it is assigned per category below:
  #   framework-agnostic Composer package  -> sandermuller/package-boost-php
  #   Laravel-specific Composer package    -> sandermuller/package-boost-laravel
  #   Laravel application                  -> laravel/boost
  # All three pull sandermuller/boost-core transitively (the skill-sync engine).
  test-framework:
    pest:
      require-dev:
        - pestphp/pest
        - pestphp/pest-plugin-arch
        - mrpunyapal/rector-pest
    pest-laravel-only:
      # added on top of pest when category in {laravel-project, laravel-package}
      # NOTE: pestphp/pest-plugin-laravel ^4.1+ required for Laravel 13 support.
      # For laravel-project: Laravel ships PHPUnit by default; pest is opt-in
      # via `--test-framework=pest` (then user runs `vendor/bin/pest --init`
      # separately to migrate). CLI default for laravel-project is phpunit
      # (not pest) for vendors outside the sander/hihaho convention.
      require-dev:
        - "pestphp/pest-plugin-laravel: ^4.1"
    phpunit:
      require-dev:
        - phpunit/phpunit

categories:

  laravel-project:
    mandatory:
      require: []  # laravel new baseline; not enumerated here
      # IMPORTANT: CLI implementations MUST filter the require-dev list by
      # what `laravel new` already installed. Laravel 13+ ships some of these
      # in `require` (laravel/tinker moved from require-dev → require). The
      # CLI must `composer show --installed --format=json` and skip already-
      # present packages, otherwise `composer require --dev` errors with
      # "currently present in the require key".
      require-dev:
        - larastan/larastan
        - laravel/boost
        - laravel/pail
        - laravel/tinker
        - driftingly/rector-laravel
    optional:
      with-hihaho-rules:
        default-inference: vendor==hihaho OR hihaho/phpstan-rules in require-dev
        require: []
        require-dev:
          - hihaho/phpstan-rules
          - hihaho/rector-rules
          - symplify/phpstan-rules
      with-security-advisories:
        default-inference: roave/security-advisories in require-dev
        require: []
        require-dev:
          - "roave/security-advisories: dev-latest"
    shared-exclusions: []  # nothing dropped from shared list

  laravel-package:
    mandatory:
      require:
        - "illuminate/contracts: __LARAVEL_VERSIONS__"
        - "illuminate/support: __LARAVEL_VERSIONS__"
      require-dev:
        - larastan/larastan
        - laravel/boost  # testbench.yaml loads Laravel\Boost\BoostServiceProvider during package-boost:sync; missing it fatals the sync
        - driftingly/rector-laravel
        - sandermuller/package-boost-laravel  # Laravel-flavoured boost umbrella; pulls boost-core + package-boost-php transitively
    optional:
      hihaho-package-tools-flavoured:
        default-inference: spatie/laravel-package-tools in require
        require:
          - spatie/laravel-package-tools
        require-dev: []
        also-selects-stub-variant: laravel-package-spatie
    suggests:
      - livewire/livewire  # informational only — never auto-installed, never audited
    shared-exclusions: []

  php-package:
    mandatory:
      require: []
      require-dev:
        - phpstan/phpstan
        - stolt/lean-package-validator
        - sandermuller/package-boost-php  # framework-agnostic boost umbrella; pulls boost-core transitively
    optional: {}
    shared-exclusions: []

  phpstan-extension:
    mandatory:
      require:
        - "phpstan/phpstan: ^2"
      require-dev:
        - sandermuller/package-boost-php  # framework-agnostic boost umbrella; pulls boost-core transitively
    optional:
      laravel-aware:
        default-inference: illuminate/* in require
        require:
          - "illuminate/support: __LARAVEL_VERSIONS__"
        require-dev:
          - larastan/larastan  # REPLACES phpstan/phpstan when this opt-in fires
        replaces-in-require-dev:
          - phpstan/phpstan
    shared-exclusions:
      - phpstan/phpstan  # because added to require

  rector-extension:
    mandatory:
      require:
        - "rector/rector: ^2"
        - "symplify/rule-doc-generator-contracts: ^11.2"
      require-dev:
        - sandermuller/package-boost-php  # framework-agnostic boost umbrella; pulls boost-core transitively
    optional:
      laravel-aware:
        default-inference: driftingly/rector-laravel in require OR require-dev
        require:
          - driftingly/rector-laravel
        require-dev: []
    shared-exclusions:
      - rector/rector  # because added to require

  composer-plugin:
    mandatory:
      require:
        - "composer-plugin-api: ^2.6"
      require-dev:
        - "composer/composer: ^2.6"
        - sandermuller/package-boost-php  # framework-agnostic boost umbrella; pulls boost-core transitively
    optional:
      runtime-api:
        default-inference: plugin uses Composer\InstalledVersions in its own source
        require:
          - "composer-runtime-api: ^2.2"
        require-dev: []
    shared-exclusions:
      - orchestra/testbench  # plugins don't fit testbench
    sub-flags:
      # Detected from src/, not from composer.json keys. Audit derives.
      command-provider:
        detection: extra.class implements Capable AND getCapabilities() returns [CommandProvider::class => ...]
      event-subscriber:
        detection: extra.class implements EventSubscriberInterface
      boost-skill-provider:
        detection: resources/boost/skills/ dir exists

  # skill-bundle: a distributable package whose product is the AI skills it
  # ships under resources/boost/skills/. type: library, no src/ PHP code.
  # Detection: type: library AND sandermuller/boost-core in `require` (runtime).
  # Full category — own bootstrap/audit/upgrade phases (NOT a fall-through).
  # NOTE: skill-bundle ships pure-markdown skills and no PHP source — so it
  # carries NO test runner (no pest, no phpunit) and consumes NO shared dev-dep
  # block (neither shared.always NOR shared.test-framework.*). Its complete
  # dependency set is exactly the `mandatory` block below — nothing is merged.
  skill-bundle:
    mandatory:
      require:
        - sandermuller/boost-core  # runtime require — consumers need it to discover the shipped skills; require-dev is not transitive
      require-dev:
        - laravel/pint
        - stolt/lean-package-validator
    optional: {}
    # consumes-shared-dev-deps: false → a consumer/CLI building this category's
    # dependency list MUST skip BOTH shared.always AND shared.test-framework.*
    # (incl. pest / pest-laravel / phpunit). The deps come solely from this
    # category's `mandatory` block above. The key is a sibling of mandatory/
    # optional; boolean; absent ⇒ true (every other category DOES consume the
    # shared list + its test-framework block).
    consumes-shared-dev-deps: false
    shared-exclusions: []

  # Phase 8 LOW: bootstrap-only categories. audit + upgrade fall through to
  # laravel-package phases (these are structurally laravel-packages with
  # ecosystem-specific runtime deps).
  filament-plugin:
    mandatory:
      require:
        - "filament/filament: ^3.0||^4.0"
        - "illuminate/contracts: __LARAVEL_VERSIONS__"
        - "illuminate/support: __LARAVEL_VERSIONS__"
      require-dev:
        - larastan/larastan
        - laravel/boost  # testbench.yaml loads Laravel\Boost\BoostServiceProvider during package-boost:sync; missing it fatals the sync
        - driftingly/rector-laravel
        - sandermuller/package-boost-laravel  # Laravel-flavoured boost umbrella; pulls boost-core + package-boost-php transitively
    optional: {}
    suggests:
      # When the plugin uses specific Filament components in tests, the user
      # may want to require these individually. Not auto-installed.
      - filament/forms
      - filament/tables
      - filament/notifications
    shared-exclusions: []
    audit-via: laravel-package
    upgrade-via: laravel-package

  nova-tool:
    mandatory:
      require:
        - "laravel/nova: ^5.0"
        - "illuminate/contracts: __LARAVEL_VERSIONS__"
        - "illuminate/support: __LARAVEL_VERSIONS__"
      require-dev:
        - larastan/larastan
        - laravel/boost  # testbench.yaml loads Laravel\Boost\BoostServiceProvider during package-boost:sync; missing it fatals the sync
        - driftingly/rector-laravel
        - sandermuller/package-boost-laravel  # Laravel-flavoured boost umbrella; pulls boost-core + package-boost-php transitively
    optional: {}
    suggests: []
    shared-exclusions: []
    requires-nova-auth: true  # see bootstrap-nova-tool.md pre-flight
    audit-via: laravel-package
    upgrade-via: laravel-package
