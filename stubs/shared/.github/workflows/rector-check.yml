name: rector-check

on:
  pull_request:
    paths:
      - '**.php'
      - 'rector.php'
      - 'composer.lock'
      - '.config/named-arguments-manifest.json'
      - '.github/workflows/rector-check.yml'
  # A push to main saves the cache that pull requests restore.
  push:
    branches:
      - main
    paths:
      - '**.php'
      - 'rector.php'
      - 'composer.lock'
      - '.config/named-arguments-manifest.json'
      - '.github/workflows/rector-check.yml'

permissions:
  contents: read

concurrency:
  group: rector-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rector-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      # The key carries the commit SHA because actions/cache never overwrites a key:
      # without it, the first save is restored forever. Only a push to main saves,
      # because a pull_request cache is visible to that pull request only.
      # cache-prune.yml deletes superseded entries.
      # Rector writes PHPStan's reflection cache into .cache/phpstan (see rector.php).
      # cache/nette.configurator is left out, as in phpstan.yml.
      # Rector caches a file on its own content, so a rule that reads another file
      # (the named-argument manifest, the route files) gets a stale result from a
      # cache built before that file changed. Those files are in the key, and no
      # restore key falls back to a cache built from other inputs.
      - name: Restore Rector cache
        id: rector_cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache/rector/
            .cache/phpstan/cache/PHPStan
          key: rector-cache-${{ hashFiles('composer.lock', 'rector.php', '.config/named-arguments-manifest.json', 'routes/**/*.php') }}-${{ github.sha }}
          restore-keys: |
            rector-cache-${{ hashFiles('composer.lock', 'rector.php', '.config/named-arguments-manifest.json', 'routes/**/*.php') }}-

      - name: Ensure Rector cache directories exist
        run: mkdir -p .cache/rector .cache/phpstan

      # Rector exits 0 on a clean dry run even when it prints a warning, for example
      # about a skipped rule that no set registers. The grep fails the job on a warning.
      - name: Run Rector (dry-run)
        run: |
          set -o pipefail
          vendor/bin/rector process --dry-run 2>&1 | tee "$RUNNER_TEMP/rector.txt"
          if grep -q '\[WARNING\]' "$RUNNER_TEMP/rector.txt"; then
            echo "::error::Rector printed a warning. See the output above."
            exit 1
          fi

      - name: Save Rector cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rector_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .cache/rector/
            .cache/phpstan/cache/PHPStan
          key: rector-cache-${{ hashFiles('composer.lock', 'rector.php', '.config/named-arguments-manifest.json', 'routes/**/*.php') }}-${{ github.sha }}
